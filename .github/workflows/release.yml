# Builds BaoCode for macOS, Windows and Linux and publishes it to dl.baocode.dev
# (Cloudflare R2), where installed apps find their updates. docs/release.md
# has the whole of it: versions, secrets, what goes where.
#
#   git tag v1.2.0 && git push origin v1.2.0   build and publish 1.2.0
#   git tag test-foo && git push origin test-foo
#                                              build, and put the installers
#                                              at dl.baocode.dev/test/…, to
#                                              send to testers (no update)
#   Actions → Release → Run workflow           build only, to try the build
#
# The remote server alone: a server-* tag (remote.yml, which this calls).
#
# A version may be published again (the tag moved to a fixed commit): the
# links end in each file's hash, so the CDN serves the new files at once.
# Installed apps already on that version are not offered it again.
name: Release

on:
  push:
    # Not this fork's v*-fork.* tags: fork-release.yml builds those.
    tags: ['v*', 'test-*', '!v*-fork.*']
  workflow_dispatch:

permissions:
  contents: read

# One release at a time; one that started is never cancelled halfway
# through its upload. A build for testers, or run by hand, publishes no
# release, and waits for none.
concurrency:
  group: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || format('build-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.47.5

jobs:
  check:
    name: Check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      marketing: ${{ steps.version.outputs.marketing }}
      publish: ${{ steps.version.outputs.publish }}
      share: ${{ steps.version.outputs.share }}
    steps:
      - uses: actions/checkout@v4
      - id: version
        name: Read pubspec.yaml's version, and match the tag against it
        run: |
          version=$(sed -n 's/^version:[[:space:]]*//p' pubspec.yaml)
          marketing=${version%%+*}
          code=$(sed -n "s/^const appVersionString = '\(.*\)';/\1/p" lib/update/version.dart)
          echo "pubspec.yaml: $version, lib/update/version.dart: $code"
          if [ "$version" != "$code" ]; then
            echo "::error::lib/update/version.dart says $code, pubspec.yaml $version: run tool/bump_version.dart"
            exit 1
          fi
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+\+[0-9]+$ ]]; then
            echo "::error::$version is not x.y.z+build"
            exit 1
          fi
          publish=false
          share=false
          if [ "$GITHUB_REF_TYPE" = tag ] && [[ "$GITHUB_REF_NAME" == test-* ]]; then
            share=true
          elif [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "v$marketing" ]; then
              echo "::error::Tag $GITHUB_REF_NAME, but pubspec.yaml is $version: the tag has to be v$marketing"
              exit 1
            fi
            publish=true
          fi
          {
            echo "version=$version"
            echo "marketing=$marketing"
            echo "publish=$publish"
            echo "share=$share"
          } >> "$GITHUB_OUTPUT"
      - name: Be no older than the version published
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          published=$(curl -fsS https://dl.baocode.dev/releases/latest.json | jq -r .version || true)
          echo "Published: ${published:-none}, this: $VERSION"
          [ -z "$published" ] && exit 0
          # x.y.z+build, compared number by number.
          python3 - "$published" "$VERSION" <<'EOF'
          import re, sys
          def key(v):
              m = re.fullmatch(r'v?(\d+)\.(\d+)\.(\d+)(?:-[0-9A-Za-z.-]+)?(?:\+(\d+))?', v)
              return tuple(int(x or 0) for x in m.groups())
          published, this = sys.argv[1:]
          if key(this) < key(published):
              sys.exit(f'::error::{this} is older than {published}, which is published: installed apps would not take it')
          if key(this) == key(published):
              print(f'::warning::{this} is published already: publishing it again')
          EOF

  # Once, for both apps: they carry its servers.json, and download the
  # build a host needs from dl.baocode.dev (docs/ssh-remote.md, 9.3). Its
  # artifacts: remote (VERSION, servers.json, the .gz), remote-linux.
  remote:
    name: Remote server
    needs: check
    uses: ./.github/workflows/remote.yml

  macos:
    name: Build for macOS
    needs: [check, remote]
    runs-on: macos-15
    # The Developer ID certificate and the notary key are the release
    # environment's secrets, for its tags only (v*, and test-* for testers).
    # Without them (a build only, or before they are set) the app is signed
    # ad hoc, and opens only after Open Anyway (System Settings → Privacy &
    # Security).
    environment: ${{ (needs.check.outputs.publish == 'true' || needs.check.outputs.share == 'true') && 'release' || '' }}
    env:
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      NOTARY_KEY: ${{ secrets.NOTARY_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Put the Developer ID certificate in a keychain
        if: env.MACOS_CERTIFICATE != ''
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
      - name: Put the notary key in a file
        if: env.NOTARY_KEY != ''
        run: |
          echo "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          echo "BAOCODE_NOTARY_KEY=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"
      - uses: actions/download-artifact@v4
        with:
          name: remote
          path: build/remote
      - name: Install create-dmg
        run: brew install create-dmg
      - name: Build, sign and notarise
        env:
          BAOCODE_MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          BAOCODE_NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          BAOCODE_NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
        run: dart run tool/build_macos.dart --remote-built
      - name: Launch each app, as an update installs it
        run: |
          # A valid signature is not enough: dyld can still refuse to load
          # the app's frameworks (as with the hardened runtime ad hoc). The
          # Intel one runs under Rosetta here.
          softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true
          for arch in arm64 x64; do
            dir="$RUNNER_TEMP/launch-$arch"
            mkdir "$dir"
            ditto -x -k build/installers/BaoCode-*-mac-$arch.zip "$dir"
            BAOCODE_DATA_DIR="$dir-data" \
              "$dir/BaoCode.app/Contents/MacOS/BaoCode" > "$dir.log" 2>&1 &
            pid=$!
            sleep 15
            if ! kill -0 $pid 2>/dev/null; then
              cat "$dir.log"
              echo "::error::BaoCode ($arch) exited within 15 seconds of launch"
              exit 1
            fi
            echo "BaoCode ($arch) is running after 15 seconds"
            kill $pid
          done
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            build/installers/BaoCode-*.dmg
            build/installers/BaoCode-*-mac-*.zip
      - name: Forget the certificate and the key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/notary.p8"

  windows:
    name: Build for Windows
    needs: [check, remote]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - uses: actions/download-artifact@v4
        with:
          name: remote
          path: build/remote
      - name: Build
        run: dart run tool/build_windows.dart --remote-built
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: build/installers/BaoCode-*-setup.exe

  linux:
    name: Build for Linux (${{ matrix.arch }})
    needs: [check, remote]
    # The oldest Ubuntu built on: its glibc and GTK are what the package
    # runs on from there up.
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - arch: x64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        if: matrix.arch == 'x64'
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      # Flutter publishes no SDK archive for Linux on arm64, so there it is
      # cloned at the release's tag; the engine it downloads has arm64 builds.
      - name: Clone Flutter
        if: matrix.arch == 'arm64'
        run: |
          git clone --depth 1 --branch "$FLUTTER_VERSION" \
            https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/flutter/bin/flutter" --version
      - name: Install GTK's build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev \
            liblzma-dev libstdc++-12-dev xvfb dbus-x11
      - uses: actions/download-artifact@v4
        with:
          name: remote
          path: build/remote
      - name: Build
        run: flutter build linux --release
      - name: Package the .deb and the tarball
        run: |
          sh tool/package_linux_deb.sh
          dpkg-deb --info build/installers/BaoCode-*.deb
      - name: Install the package and launch it
        run: |
          sudo apt-get install -y ./build/installers/BaoCode-*.deb
          log="$RUNNER_TEMP/launch.log"
          BAOCODE_DATA_DIR="$RUNNER_TEMP/launch-data" \
            dbus-run-session -- xvfb-run -a /opt/baocode/baocode > "$log" 2>&1 &
          sleep 15
          if ! pgrep -x baocode > /dev/null; then
            cat "$log"
            echo "::error::BaoCode exited within 15 seconds of launch"
            exit 1
          fi
          echo "BaoCode is running after 15 seconds"
          pkill -x baocode || true
      - uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            build/installers/BaoCode-*.deb
            build/installers/BaoCode-*.tar.gz

  share:
    name: Put it at dl.baocode.dev/test/ for testers
    needs: [check, macos, windows, linux]
    if: needs.check.outputs.share == 'true'
    runs-on: ubuntu-latest
    # The release environment's R2 token (it lets test-* tags in): test/ is
    # outside releases/, and latest.json is not touched, so no installed app
    # is offered what goes there.
    environment: release
    env:
      MARKETING: ${{ needs.check.outputs.marketing }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: macos
          path: dist/macos
      - uses: actions/download-artifact@v4
        with:
          name: windows
          path: dist/windows
      - uses: actions/download-artifact@v4
        with:
          pattern: linux-*
          path: dist/linux
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: remote
          path: dist/remote
      - name: Upload
        run: |
          # A folder of its own each time: the version, the tag, the run.
          name=$(printf '%s' "${GITHUB_REF_NAME#test-}" | tr -c 'A-Za-z0-9.-' '-' | sed 's/-*$//')
          dir="test/$MARKETING-$name-$GITHUB_RUN_NUMBER"
          # The remote server too, where the app downloads it for an SSH
          # host: under its own version, which a release never changes.
          aws s3 cp dist/remote "s3://$R2_BUCKET/releases/remote/$(cat dist/remote/VERSION)/" \
            --recursive --exclude '*' --include '*.gz' --include servers.json \
            --cache-control 'public, max-age=31536000, immutable'
          {
            echo "## For testers: $MARKETING, \`$GITHUB_REF_NAME\` (${GITHUB_SHA::7})"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
          for file in dist/macos/BaoCode-*.dmg dist/windows/BaoCode-*-setup.exe dist/linux/BaoCode-*.deb; do
            name=$(basename "$file")
            aws s3 cp "$file" "s3://$R2_BUCKET/$dir/$name" --cache-control 'public, max-age=86400'
            url="https://dl.baocode.dev/$dir/$name"
            served=$(curl -fsSI "$url" | tr -d '\r' | awk 'tolower($1) == "content-length:" { print $2 }')
            [ "$served" = "$(stat -c %s "$file")" ] || { echo "::error::$url is not served as uploaded"; exit 1; }
            echo "- [$name]($url)" >> "$GITHUB_STEP_SUMMARY"
          done
          cat "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish to dl.baocode.dev
    needs: [check, remote, macos, windows, linux]
    if: needs.check.outputs.publish == 'true'
    runs-on: ubuntu-latest
    # The update signing key and the R2 token are this environment's
    # secrets.
    environment: release
    permissions:
      contents: write # the GitHub release
    env:
      VERSION: ${{ needs.check.outputs.version }}
      MARKETING: ${{ needs.check.outputs.marketing }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_ENDPOINT_URL: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
      # R2 does not take every checksum newer AWS CLIs send by default.
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Gather the files
        run: |
          mkdir -p out
          for arch in arm64 x64; do
            cp dist/macos/BaoCode-$MARKETING-$arch.dmg dist/macos/BaoCode-$MARKETING-mac-$arch.zip out/
          done
          cp dist/windows/BaoCode-$MARKETING-setup.exe out/
          for arch in x64 arm64; do
            cp dist/linux-$arch/BaoCode-$MARKETING-linux-*.deb dist/linux-$arch/BaoCode-$MARKETING-linux-*.tar.gz out/
          done
          # The remote server, under the name both apps' servers.json give it;
          # servers.json too, for an app packaged with --remote-release.
          remote="out/remote/$(cat dist/remote/VERSION)"
          mkdir -p "$remote"
          cp dist/remote/*.gz dist/remote/servers.json "$remote/"
          find out -type f | sort
      - name: Sign the release into latest.json
        env:
          SIGNING_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          flutter pub get
          key="$RUNNER_TEMP/update-signing.key"
          echo "$SIGNING_KEY" > "$key"
          notes=()
          for language in en zh; do
            file="release-notes/$MARKETING.$language.md"
            if [ -f "$file" ]; then
              notes+=(--notes-$language "$file")
            else
              echo "::warning::No $file: the update notification and the changelog say nothing of $MARKETING"
            fi
          done
          BAOCODE_UPDATE_SIGNING_KEY="$key" dart run tool/release_manifest.dart \
            --version "$VERSION" \
            --windows out/BaoCode-$MARKETING-setup.exe \
            --macos-arm64 out/BaoCode-$MARKETING-mac-arm64.zip \
            --macos-x64 out/BaoCode-$MARKETING-mac-x64.zip \
            --dmg-arm64 out/BaoCode-$MARKETING-arm64.dmg \
            --dmg-x64 out/BaoCode-$MARKETING-x64.dmg \
            --linux-x64 out/BaoCode-$MARKETING-linux-amd64.deb \
            --linux-arm64 out/BaoCode-$MARKETING-linux-arm64.deb \
            --manifest out/latest.json \
            "${notes[@]}"
          rm "$key"
      - name: Upload the remote server, then the installers
        run: |
          immutable='public, max-age=31536000, immutable'
          aws s3 cp out/remote "s3://$R2_BUCKET/releases/remote/" --recursive \
            --cache-control "$immutable"
          # The newest server, for --remote-release latest (remote.yml).
          jq -n --arg version "$(cat dist/remote/VERSION)" --arg tag "$GITHUB_REF_NAME" --arg commit "$GITHUB_SHA" \
            '{version: $version, tag: $tag, commit: $commit}' > remote-latest.json
          aws s3 cp remote-latest.json "s3://$R2_BUCKET/releases/remote/latest.json" \
            --cache-control 'public, max-age=60' --content-type application/json
          for file in $(cd out && ls BaoCode-*); do
            aws s3 cp "out/$file" "s3://$R2_BUCKET/releases/$MARKETING/$file" \
              --cache-control "$immutable"
          done
      - name: Check the downloads are served
        run: |
          # At the manifest's links, which end in each file's hash: what
          # users will be given, not what the CDN may have kept of a
          # release published before under the same names.
          jq -r '(.downloads[], .platforms[]) | "\(.url) \(.size)"' out/latest.json | sort -u |
          while read -r url expected; do
            served=$(curl -fsSI "$url" | tr -d '\r' | awk 'tolower($1) == "content-length:" { print $2 }')
            echo "$url: $served bytes (expected $expected)"
            [ "$served" = "$expected" ] || { echo "::error::$url is not served as uploaded"; exit 1; }
          done
      - name: Upload latest.json, last
        run: |
          # Apps check every 6 hours; a few minutes of cache spares R2
          # without holding a release back.
          aws s3 cp out/latest.json "s3://$R2_BUCKET/releases/latest.json" \
            --cache-control 'public, max-age=300' --content-type application/json
          curl -fsS "https://dl.baocode.dev/releases/latest.json?$GITHUB_RUN_ID" | jq .
      - name: Make the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          notes=(--generate-notes)
          [ -f "release-notes/$MARKETING.en.md" ] && notes=(--notes-file "release-notes/$MARKETING.en.md")
          # Published again: the release is made anew, on the tag's commit.
          gh release delete "v$MARKETING" --yes 2>/dev/null || true
          gh release create "v$MARKETING" --title "BaoCode $MARKETING" "${notes[@]}" \
            out/BaoCode-$MARKETING-arm64.dmg out/BaoCode-$MARKETING-x64.dmg out/BaoCode-$MARKETING-setup.exe \
            out/BaoCode-$MARKETING-linux-amd64.deb out/BaoCode-$MARKETING-linux-arm64.deb \
            out/BaoCode-$MARKETING-linux-amd64.tar.gz out/BaoCode-$MARKETING-linux-arm64.tar.gz
